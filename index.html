<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web 20/10 - Cinematic Edition</title>
<style>
:root{--e:clamp(52px,17vmin,120px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#030308;color:#fff;font-family:"Courier New",Courier,monospace}
#app{position:fixed;inset:0;overflow:hidden}

/* Các lớp nền chuyển cảnh nghệ thuật, sâu thẳm và lung linh */
.L{position:absolute;inset:0;opacity:0;transition:opacity 2s cubic-bezier(0.4, 0, 0.2, 1);pointer-events:none;background-size:cover;background-position:center}
.L.on{opacity:1}

.bg-rose{background:radial-gradient(circle at 50% 30%, rgba(180,50,100,0.7), rgba(15,5,15,0.95)) }
.bg-gold{background:radial-gradient(circle at 50% 40%, rgba(214,160,40,0.5), rgba(10,15,30,0.95))}
.bg-night{background:linear-gradient(135deg, #0d234a 0%, #060d21 50%, #010206 100%)}
.bg-heal{background:radial-gradient(circle at 70% 60%, rgba(180,45,45,0.6), #06030c 70%)}
.bg-beauty{background:radial-gradient(circle at 30% 50%, rgba(70,25,90,0.7), #0a0414 80%)}
.bg-smile{background:radial-gradient(circle at 60% 40%, rgba(160,60,95,0.55), #070306 75%)}
.bg-fin{background:radial-gradient(circle at 50% 50%, rgba(90,20,120,0.7), #020106 85%)}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Khung hiển thị hình ảnh nghệ thuật thay cho vector thô */
.scene-img-box {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
  filter: brightness(0.9) contrast(1.1);
  z-index: 1;
}

/* Khu vực hiển thị nốt nhạc bay nghệ thuật */
.music-container {
  position: absolute;
  left: 6%;
  top: 48%;
  width: 42vmin;
  height: 28vmin;
  z-index: 3;
  background: rgba(15, 10, 25, 0.4);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 182, 193, 0.3);
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 0 25px rgba(255, 105, 180, 0.3);
}

.lyr{
  position: absolute;
  top: 105%;
  left: 50%;
  transform: translateX(-50%);
  width: 36vmin;
  text-align: center;
  white-space: pre-line;
  font-size: clamp(10px, 2.6vmin, 16px);
  line-height: 1.5;
  color: #fff6e6;
  text-shadow: 0 0 10px #ff99c8, 0 0 20px #ff4d94;
  opacity: 0;
  transition: opacity 0.6s ease;
  font-weight: bold;
}
.lyr.show{opacity:1}

/* Hiệu ứng nốt nhạc mượt mà bay lượn */
@keyframes floatNote {
  0% { transform: translateY(0px) scale(0.8); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateY(-35px) scale(1.2); opacity: 0; }
}
.floating-note {
  animation: floatNote 2.2s ease-in-out infinite;
  display: inline-block;
}
.floating-note:nth-child(2) { animation-delay: 0.7s; }
.floating-note:nth-child(3) { animation-delay: 1.4s; }

/* Đôi mắt phát sáng biểu cảm */
#eyes{--x:0px;--y:0px;position:absolute;left:50%;top:46%;display:flex;gap:5.5vmin;align-items:center;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)));transition:transform 2.2s ease,opacity 1.5s;opacity:0;z-index:4}
#eyes.on{opacity:1}
.eye{position:relative;width:var(--e);height:var(--e);border-radius:28%;background:linear-gradient(145deg,#aef7ff,#17e3ff 55%,#0bc4ec);box-shadow:0 0 15px 3px #2de9ff,0 0 40px 10px rgba(45,233,255,0.6),inset 0 0 16px rgba(255,255,255,0.8);transition:height .5s,width .5s,transform .16s}
.eye::after{content:"////";position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:1.4vmin;font-size:clamp(8px,2vmin,14px);color:#ff9ec0;opacity:0;transition:opacity 1s}
#eyes.blush .eye::after{opacity:.7}
.eye.blink{transform:scaleY(.18)}
.eye.happy{height:calc(var(--e)*.3);border-radius:0 0 100% 100%/0 0 100% 100%;background:transparent;border-bottom:.9vmin solid #2de9ff;box-shadow:0 10px 16px -6px rgba(45,233,255,0.9)}
.eye.happy:first-child{width:calc(var(--e)*.35)}
.eye.happy:last-child{width:calc(var(--e)*.62)}
.eye.happy::after{opacity:0}

/* Vùng hiển thị chữ/lời chúc */
.t{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,780px);text-align:center;white-space:pre-line;opacity:0;transition:opacity 1s;letter-spacing:.15em;line-height:1.6;font-size:clamp(15px,4.2vmin,32px);z-index:5;pointer-events:none}
.t.show{opacity:1}
#top{top:calc(env(safe-area-inset-top,0px) + 9vh)}
#cap{top:calc(46% + var(--e)/2 + 8vmin)}
.cy{color:#eafcff;text-shadow:0 0 8px #fff,0 0 20px #2de9ff}
.pk{color:#ffc2da;text-shadow:0 0 12px #ff6fa8}
.pw{color:#fff;text-shadow:0 0 8px #ffd0e8,0 0 20px #ff7fc0}
.wm{color:#fff3c8;text-shadow:0 0 12px #ffb84d}
.big{font-size:clamp(36px,12vmin,95px)}

#replay{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);transform:translateX(-50%);z-index:6;padding:15px 34px;border-radius:999px;border:1px solid #2de9ff;background:rgba(45,233,255,0.15);color:#eafcff;font:inherit;font-size:18px;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 20px rgba(45,233,255,0.5);opacity:0;pointer-events:none;transition:opacity 1s;touch-action:manipulation}
#replay.on{opacity:1;pointer-events:auto}
#replay:active{background:rgba(45,233,255,0.35)}
</style>
</head>
<body>
<div id="app">
  <!-- Các phân đoạn được cách tân tinh tế hơn -->
  <div class="L bg-rose" data-f="s1"></div>
  <div class="L bg-gold" data-f="s2">
    <!-- Phân đoạn 3 & 4: Khung cảnh áo dài và hoa cỏ rực rỡ sắc nét -->
    <div style="position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;z-index:2;padding:2vh 3vw;">
      <svg viewBox="0 0 300 350" style="width:min(55vh,80vw);height:auto;filter:drop-shadow(0 0 15px rgba(255,182,193,0.4));">
        <!-- Hình ảnh cách điệu 2 thiếu nữ áo dài thướt tha, sắc nét -->
        <path d="M120 40 Q130 10 150 40 Q170 20 180 50 Q190 120 170 220 L150 340 L90 340 L110 220 Z" fill="#200d2b" stroke="#ffb7d5" stroke-width="1.5"/>
        <path d="M180 50 Q190 20 210 45 Q230 30 240 60 Q250 130 230 230 L210 340 L160 340 L175 230 Z" fill="#150820" stroke="#ffd1e8" stroke-width="1.5"/>
        <path d="M115 50 Q150 20 185 50 Q170 30 150 25 Q130 30 115 50 Z" fill="#ffe3ee"/>
      </svg>
    </div>
  </div>

  <div class="L bg-night" data-f="s3">
    <!-- Chòm sao Cupid nghệ thuật lấp lánh -->
    <svg style="position:absolute;inset:0;width:100%;height:100%;z-index:2;" viewBox="0 0 100 100" preserveAspectRatio="none">
      <g fill="none" stroke="rgba(255,140,200,0.7)" stroke-width="1" stroke-dasharray="1.5 2.5">
        <path d="M15,35 Q30,15 45,32 Q28,45 15,35 Z"/>
        <polyline points="45,32 65,22 78,28"/>
        <path d="M85,22 Q90,14 95,22 Q100,30 85,42 Q70,30 75,22 Q80,14 85,22 Z"/>
      </g>
      <g fill="#fff" filter="drop-shadow(0 0 4px #ff69b4)">
        <circle cx="15" cy="35" r="1"/><circle cx="30" cy="18" r="1"/><circle cx="45" cy="32" r="1"/>
        <circle cx="65" cy="22" r="1"/><circle cx="78" cy="28" r="1"/><circle cx="85" cy="22" r="1.6"/>
        <circle cx="95" cy="22" r="1"/><circle cx="75" cy="22" r="1"/><circle cx="20" cy="70" r="0.8"/>
        <circle cx="80" cy="75" r="0.8"/><circle cx="50" cy="85" r="0.8"/><circle cx="90" cy="12" r="0.8"/>
      </g>
    </svg>
  </div>

  <div class="L bg-heal" data-f="s4"></div>
  <div class="L bg-beauty" data-f="s5"></div>
  
  <div class="L bg-smile" data-f="s6">
    <!-- Phân đoạn 1: Khuông nhạc và nốt nhạc bay lượn tinh tế nghệ thuật -->
    <div class="music-container">
      <svg viewBox="0 0 200 100" style="width:100%;height:100%;overflow:visible;">
        <path d="M10,50 Q50,15 100,50 T190,50" fill="none" stroke="rgba(255,182,193,0.5)" stroke-width="1.5"/>
        <path d="M10,60 Q50,25 100,60 T190,60" fill="none" stroke="rgba(255,182,193,0.5)" stroke-width="1.5"/>
        <path d="M10,40 Q50,5 100,40 T190,40" fill="none" stroke="rgba(255,182,193,0.5)" stroke-width="1.5"/>
        
        <!-- Nốt nhạc phát sáng chuyển động -->
        <g class="floating-note" fill="#ffb6c1" stroke="#fff" stroke-width="0.8" transform="translate(30,0)">
          <ellipse cx="20" cy="45" rx="4" ry="3" transform="rotate(-15 20 45)"/>
          <path d="M22.5,45 L22.5,25" stroke="#ffb6c1" stroke-width="1.8" fill="none"/>
        </g>
        <g class="floating-note" fill="#ff69b4" stroke="#fff" stroke-width="0.8" transform="translate(85,0)">
          <ellipse cx="20" cy="32" rx="4" ry="3" transform="rotate(-15 20 32)"/>
          <path d="M22.5,32 L22.5,12" stroke="#ff69b4" stroke-width="1.8" fill="none"/>
        </g>
        <g class="floating-note" fill="#ffb6c1" stroke="#fff" stroke-width="0.8" transform="translate(140,0)">
          <ellipse cx="20" cy="55" rx="4" ry="3" transform="rotate(-15 20 55)"/>
          <path d="M22.5,55 L22.5,35" stroke="#ffb6c1" stroke-width="1.8" fill="none"/>
        </g>
      </svg>
      <p class="lyr" id="lyr"></p>
    </div>
  </div>

  <div class="L bg-fin" data-f="s7"></div>

  <canvas id="fx"></canvas>
  <div id="eyes"><div class="eye"></div><div class="eye"></div></div>
  <p id="top" class="t"></p>
  <p id="cap" class="t"></p>
  <button id="replay" type="button">↻ Xem lại</button>
</div>

<script>
var LYRICS=["[lời bài hát 1]","[lời bài hát 2]","[lời bài hát 3]","[lời bài hát 4]","[lời bài hát 5]","[lời bài hát 6]"];

var $=function(i){return document.getElementById(i)},R=function(a,b){return a+Math.random()*(b-a)};

var cv=$('fx'),cx=cv.getContext('2d'),W,H,P=[],G=[],S=[],SH=[],lt=0,rt;
var fx={p:0,l:0,s:0,h:0},tg={p:0,l:0,s:0,h:0};

function size(){
  var D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  function mk(n,a,b){var o=[];for(var i=0;i<n;i++)o.push({x:R(0,W),y:R(0,H),s:R(a,b),v:R(.6,1.5),d:R(0,6.3),r:R(0,6.3)});return o}
  P=mk(70,2.5,5);G=mk(18,5,8);
  S=[];for(var i=0,n=Math.min(180,W*H/7000|0);i<n;i++)S.push({x:R(0,W),y:R(0,H),r:R(.8,2.2),p:R(0,6.3),k:R(.5,2.5)});
}

function fall(a,t,col,al){
  cx.fillStyle=col;cx.globalAlpha=al;
  for(var i=0;i<a.length;i++){var p=a[i];p.y+=p.v;p.x+=Math.sin(t/800+p.d)*.8+.4;p.r+=.04;
    if(p.y>H+10){p.y=-10;p.x=R(0,W)}if(p.x>W+10)p.x=-10;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.beginPath();cx.moveTo(0,-p.s);cx.lineTo(p.s*.7,p.s);cx.lineTo(-p.s*.7,p.s);cx.fill();cx.restore()}
}

function tick(t){
  requestAnimationFrame(tick);if(t-lt<32)return;lt=t;
  for(var k in fx)fx[k]+=(tg[k]-fx[k])*.05;
  cx.clearRect(0,0,W,H);
  if(fx.s>.02){cx.fillStyle='#fff';for(var i=0;i<S.length;i++){var s=S[i];cx.globalAlpha=fx.s*(.4+.6*Math.abs(Math.sin(t/900*s.k+s.p)));cx.fillRect(s.x,s.y,s.r,s.r)}}
  if(fx.p>.02)fall(P,t,'#ff69b4',fx.p*.85);
  if(fx.l>.02)fall(G,t,'#ffb84d',fx.l*.9);
  if(fx.h>.02&&Math.random()<.03*fx.h&&SH.length<4)SH.push({x:R(W*.3,W),y:R(0,H*.4),vx:R(-10,-7),vy:R(2,5),a:1});
  cx.lineWidth=2;cx.strokeStyle='#eaf4ff';
  for(var j=SH.length-1;j>=0;j--){var q=SH[j];q.x+=q.vx;q.y+=q.vy;q.a-=.015;if(q.a<=0){SH.splice(j,1);continue}
    cx.globalAlpha=q.a;cx.beginPath();cx.moveTo(q.x,q.y);cx.lineTo(q.x-q.vx*10,q.y-q.vy*10);cx.stroke()}
  cx.globalAlpha=1;
}
size();requestAnimationFrame(tick);
addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(size,200)});

var eyes=$('eyes'),E=[].slice.call(eyes.children),topEl=$('top'),cap=$('cap'),lyr=$('lyr'),replay=$('replay'),tm=[];
function at(ms,f){tm.push(setTimeout(f,ms))}
function say(el,txt,cls){el.classList.remove('show');tm.push(setTimeout(function(){if(!txt)return;el.textContent=txt;el.className='t show '+(cls||'')},txt?500:0))}
function type(el,txt,cls,ms){el.className='t show '+cls;el.textContent='';var i=0;(function n(){if(i<=txt.length){el.textContent=txt.slice(0,i++);tm.push(setTimeout(n,ms))}})()}
function happy(a,b){E[0].classList.toggle('happy',a);E[1].classList.toggle('happy',b===undefined?a:b)}
function sc(n,x,y,o){
  [].forEach.call(document.querySelectorAll('.L'),function(l){l.classList.toggle('on',l.dataset.f.split(' ').indexOf(n)>-1)});
  eyes.style.setProperty('--x',x||'0px');eyes.style.setProperty('--y',y||'0px');
  for(var k in o)tg[k]=o[k];
}

setInterval(function(){
  if(eyes.classList.contains('on')&&!E[0].classList.contains('happy')&&!E[1].classList.contains('happy')){
    E.forEach(function(e){e.classList.add('blink')});setTimeout(function(){E.forEach(function(e){e.classList.remove('blink')})},170)}
},4200);

function play(){
  tm.forEach(clearTimeout);tm=[];replay.classList.remove('on');
  eyes.className='';E.forEach(function(e){e.className='eye'});
  topEl.className='t';cap.className='t';lyr.className='lyr';
  sc('s0','0px','0px',{p:0,l:0,s:0,h:0});

  at(300,function(){eyes.classList.add('on')});
  at(700,function(){type(topEl,'Hôm nay tớ nhận lệnh từ Thành xinh gái là để...','cy',60)});
  at(3900,function(){topEl.classList.remove('show')});

  at(4200,function(){sc('s1','0px','0px',{p:1,s:.3,l:0,h:0});eyes.classList.add('blush');E.forEach(function(e){e.classList.add('blink')});setTimeout(function(){E.forEach(function(e){e.classList.remove('blink')})},170);say(cap,'ui cậu đẹp quá','cy')});

  at(9800,function(){say(cap,'');say(topEl,'à thì cũng sắp\n20/10 rồi','pk');sc('s2','-10vmin','-2vmin',{p:.5,l:1,s:.3,h:.5})});

  at(17000,function(){eyes.classList.remove('blush');say(topEl,'nên là tớ muốn','cy');happy(true);sc('s3','-6vmin','0px',{p:0,l:0,s:1,h:1})});

  at(23000,function(){say(topEl,'chúc cậu thật nhiều sức khỏe','cy');happy(true,false);sc('s4','-14vmin','0px',{p:0,l:0,s:.6,h:.3})});
  at(24800,function(){happy(false)});

  at(26500,function(){say(topEl,'chúc cậu thật xinh đẹp','pw');sc('s5','0px','0px',{p:0,l:0,s:.9,h:0})});

  at(32000,function(){eyes.classList.add('blush');say(topEl,'và chúc cậu luôn giữ\nnụ cười trên môi','wm');sc('s6','-15vmin','-12vmin',{p:.3,l:0,s:.8,h:0})});
  LYRICS.forEach(function(l,i){
    at(33200+i*3200,function(){lyr.textContent=l;lyr.classList.add('show')});
    at(33200+i*3200+2700,function(){lyr.classList.remove('show')});
  });

  var end=33200+LYRICS.length*3200+600;
  at(end,function(){eyes.classList.remove('blush');happy(true);say(topEl,'20/10','cy big');sc('s7','0px','0px',{p:0,l:0,s:1,h:.6})});
  at(end+3500,function(){replay.classList.add('on')});
}
replay.addEventListener('click',play);
play();
</script>

<audio id="bg-music" loop preload="auto">
  <source src="./nhacnen.mp3" type="audio/mpeg">
</audio>

<button id="music-btn" style="position:fixed;bottom:20px;right:16px;z-index:9999;padding:12px 18px;border-radius:30px;background:#001b2b;color:white;border:1px solid #2de9ff;">
  🎵 Bật nhạc
</button>

<script>
const music = document.getElementById("bg-music");
const btn = document.getElementById("music-btn");

function updateButton() {
  btn.textContent = music.paused ? "🎵 Bật nhạc" : "🔇 Tắt nhạc";
}

music.play().then(updateButton).catch(updateButton);

btn.addEventListener("click", function () {
  if (music.paused) {
    music.play().then(updateButton).catch(updateButton);
  } else {
    music.pause();
    updateButton();
  }
});

music.addEventListener("play", updateButton);
music.addEventListener("pause", updateButton);
</script>
</body>
</html>
