<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web 20/10</title>
<style>
:root{--e:clamp(52px,17vmin,120px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Courier New",Courier,monospace}
#app{position:fixed;inset:0;overflow:hidden}
.L{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease;pointer-events:none}
.L.on{opacity:1}
.bg-rose{background:radial-gradient(ellipse 90% 70% at 0 0,rgba(130,40,80,.65),transparent 65%)}
.bg-gold{background:linear-gradient(0deg,rgba(214,160,40,.55),rgba(214,160,40,.12) 22%,transparent 42%)}
.bg-night{background:linear-gradient(0deg,#1a3f86 0,#0a1736 30%,#02030a 70%)}
.bg-heal{background:radial-gradient(ellipse 70% 80% at 85% 65%,rgba(150,40,35,.6),transparent 70%),#07040c}
.bg-beauty{background:linear-gradient(160deg,#150a22,#3a1a40 55%,#161a44)}
.bg-smile{background:radial-gradient(ellipse 60% 70% at 72% 62%,rgba(150,70,90,.45),transparent 70%),#0b0709}
.bg-fin{background:radial-gradient(ellipse 80% 60% at 50% 40%,#3a1670,transparent 70%),radial-gradient(ellipse at 20% 100%,#4a1250,transparent 55%),#05030c}
#fx{position:absolute;inset:0;width:100%;height:100%}
/* field */
.field{position:absolute;left:0;right:0;bottom:0;height:36vh}
.grow{width:100%;height:100%;transform:translateY(45%);opacity:0;transition:transform 3s ease-out,opacity 2s}
.L.on .grow{transform:none;opacity:1}
.sway{width:100%;height:100%;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{to{transform:skewX(1.6deg)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform 1.4s cubic-bezier(.3,1.5,.5,1)}
.L.on .fl{transform:scale(1)}
.couple{position:absolute;right:2vmin;bottom:8vh;height:min(46vh,95vw);opacity:0;transition:opacity 2.5s 2.5s}
.L.on .couple{opacity:1}
.couple svg{height:100%;width:auto;fill:rgba(10,6,4,.55);stroke:#f0d58a;stroke-width:1.4;stroke-linecap:round}
/* night */
.cons{position:absolute;inset:0;width:100%;height:100%}
.cons *{vector-effect:non-scaling-stroke}
.crys{position:absolute;left:50%;bottom:15vh;width:12vmin;height:12vmin;margin-left:-6vmin;background:radial-gradient(circle,rgba(110,170,255,.45),transparent 65%);animation:fl 4s ease-in-out infinite}
.crys i{position:absolute;inset:0;margin:auto}
.dia{width:6vmin;height:6vmin;transform:rotate(45deg);background:linear-gradient(135deg,#eaf4ff,#5b8fe0);border:1px solid #cfe3ff;border-radius:8%}
.rg{width:12vmin;height:5vmin;border:1px solid rgba(150,190,255,.6);border-radius:50%;animation:spin 7s linear infinite}
.rg.r2{width:5vmin;height:12vmin;animation-direction:reverse}
@keyframes fl{50%{transform:translateY(-1.6vmin)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* health */
.body{position:absolute;right:-2vmin;bottom:0;height:68vh;max-width:72vw}
.ecg{position:absolute;left:6vmin;top:60%;width:26vmin}
/* beauty */
.halo{position:absolute;left:50%;top:46%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.1);border-radius:50%}
.hill{position:absolute;left:50%;bottom:-30vmin;width:160vmin;height:60vmin;margin-left:-80vmin;border-radius:50%;border-top:1px solid rgba(255,220,240,.35);background:linear-gradient(#2a1735,#120a1c)}
.pl{position:absolute;left:0;bottom:3vh;height:52vh;width:26vh}
.pr{left:auto;right:0;transform:scaleX(-1)}
.bf{position:absolute;width:5vmin;fill:rgba(190,180,255,.5);stroke:#d9d0ff;stroke-width:.7;animation:flt 5s ease-in-out infinite}
.bf path{transform-origin:12px 9px;animation:fw .45s ease-in-out infinite alternate}
@keyframes flt{50%{transform:translate(2vmin,-3vmin) rotate(8deg)}}
@keyframes fw{to{transform:scaleX(.55)}}
/* smile */
.girl{position:absolute;right:2vmin;bottom:0;height:min(54vh,100vw)}
.pf{position:absolute;right:0;bottom:2vh;width:34vmin}
.dood{position:absolute;left:3vmin;top:55%;width:24vmin}
.rec{position:absolute;left:9vmin;top:57%;width:15vmin}
.disc{display:block;width:15vmin;height:15vmin;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:radial-gradient(circle,#ff9fc4 0 12%,#1a1118 13% 30%,#2b2229 31% 33%,#14100f 34% 60%,#2b2229 61% 63%,#14100f 64%);animation:spin 5s linear infinite}
.rec::after{content:"";position:absolute;right:-1vmin;top:-2vmin;width:2px;height:9vmin;background:#f2d6a8;transform:rotate(35deg);transform-origin:top}
.lyr{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:32vmin;margin-top:2vmin;text-align:center;white-space:pre-line;font-size:clamp(9px,2.5vmin,15px);line-height:1.4;color:#fff5e0;text-shadow:0 0 6px #ffb84d;opacity:0;transition:opacity .6s}
.lyr.show{opacity:1}
/* eyes */
#eyes{--x:0px;--y:0px;position:absolute;left:50%;top:46%;display:flex;gap:5.5vmin;align-items:center;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)));transition:transform 2.2s ease,opacity 1.5s;opacity:0;z-index:3}
#eyes.on{opacity:1}
.eye{position:relative;width:var(--e);height:var(--e);border-radius:28%;background:linear-gradient(145deg,#aef7ff,#17e3ff 55%,#0bc4ec);box-shadow:0 0 12px 2px #2de9ff,0 0 34px 8px rgba(45,233,255,.5),inset 0 0 14px rgba(255,255,255,.7);transition:height .5s,width .5s,transform .16s,border-radius .5s,background .5s,box-shadow .5s}
.eye::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 60px 24px rgba(45,233,255,.6);opacity:0;animation:gl 3s ease-in-out infinite}
@keyframes gl{50%{opacity:1}}
.eye::after{content:"////";position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:1.4vmin;font-size:clamp(8px,2vmin,14px);color:#ff9ec0;opacity:0;transition:opacity 1s}
#eyes.blush .eye::after{opacity:.6}
.eye.blink{transform:scaleY(.18)}
.eye.happy{height:calc(var(--e)*.3);border-radius:0 0 100% 100%/0 0 100% 100%;background:transparent;border-bottom:.9vmin solid #2de9ff;box-shadow:0 10px 14px -6px rgba(45,233,255,.8)}
.eye.happy:first-child{width:calc(var(--e)*.35)}
.eye.happy:last-child{width:calc(var(--e)*.62)}
.eye.happy::after{opacity:0}
/* text */
.t{position:absolute;left:50%;transform:translateX(-50%);width:min(90vw,760px);text-align:center;white-space:pre-line;opacity:0;transition:opacity .9s;letter-spacing:.14em;line-height:1.55;font-size:clamp(14px,4vmin,30px);z-index:4;pointer-events:none}
.t.show{opacity:1}
#top{top:calc(env(safe-area-inset-top,0px) + 10vh)}
#cap{top:calc(46% + var(--e)/2 + 8vmin)}
.cy{color:#eafcff;text-shadow:0 0 6px #fff,0 0 16px #2de9ff}
.pk{color:#ffc2da;text-shadow:0 0 10px #ff6fa8}
.pw{color:#fff;text-shadow:0 0 6px #ffd0e8,0 0 18px #ff7fc0}
.wm{color:#fff3c8;text-shadow:0 0 10px #ffb84d}
.big{font-size:clamp(34px,11vmin,90px)}
#replay{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);transform:translateX(-50%);z-index:5;padding:14px 32px;border-radius:999px;border:1px solid #2de9ff;background:rgba(45,233,255,.1);color:#eafcff;font:inherit;font-size:17px;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 18px rgba(45,233,255,.45);opacity:0;pointer-events:none;transition:opacity 1s;touch-action:manipulation}
#replay.on{opacity:1;pointer-events:auto}
#replay:active{background:rgba(45,233,255,.3)}
</style>
</head>
<body>
<div id="app">
  <div class="L bg-rose" data-f="s1"></div>
  <div class="L bg-gold" data-f="s2"></div>
  <div class="L" data-f="s2">
    <div class="field"><div class="grow"><svg id="fieldsvg" class="sway" preserveAspectRatio="xMidYMax meet"></svg></div></div>
    <div class="couple"><svg viewBox="0 0 200 330">
      <path d="M118 70Q120 40 148 44Q172 52 164 150M122 80Q116 140 128 190" fill="none"/>

      <circle cx="170" cy="128" r="7"/>

  <div class="L" data-f="s3">
    <svg class="cons" viewBox="0 0 100 100" preserveAspectRatio="none"><g fill="none" stroke="rgba(150,200,255,.4)" stroke-width="1" stroke-dasharray="3 4">
      <polyline points="5,35 12,18 20,28 24,12"/><polyline points="78,30 86,18 94,32 90,45"/>
      <path d="M0 60Q25 40 40 20"/><path d="M100 70Q80 55 70 35"/></g>
      <g fill="#cfe6ff"><circle cx="5" cy="35" r=".5"/><circle cx="12" cy="18" r=".5"/><circle cx="20" cy="28" r=".5"/><circle cx="24" cy="12" r=".5"/><circle cx="78" cy="30" r=".5"/><circle cx="86" cy="18" r=".5"/><circle cx="94" cy="32" r=".5"/><circle cx="90" cy="45" r=".5"/></g></svg>

  <div class="L bg-heal" data-f="s4"></div>
  <div class="L" data-f="s4">
    <svg class="body" viewBox="0 0 220 260" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.3" stroke-linecap="round">
      <path d="M10 260C14 170 50 120 105 112C160 120 200 170 205 260"/>
      <path d="M60 30C40 70 50 100 70 112M150 30C175 70 165 100 140 112M105 20C100 60 98 90 104 112"/>
      <path d="M85 152C95 138 112 136 118 148M150 150C142 134 128 134 122 146"/>
      <path d="M120 150c-8-14-30-6-22 12 6 12 22 20 22 20s16-8 22-20c8-18-14-26-22-12z" fill="#d93a32" stroke="none" opacity=".9"/>

      <path d="M30 20C20 4 2 14 12 28 18 36 30 44 30 44S42 36 48 28C58 14 40 4 30 20Z"/>
      <polyline points="0,62 40,62 50,62 56,46 64,68 70,56 76,62 130,62"/>
    </svg>
    <svg class="bf" style="left:8%;top:30%" viewBox="0 0 24 18"><path d="M12 9C6 -2 -2 3 3 11 5 14 10 13 12 9ZM12 9C18 -2 26 3 21 11 19 14 14 13 12 9Z"/></svg>
  </div>
  <div class="L bg-beauty" data-f="s5"></div>
  <div class="L" data-f="s5">
    <i class="halo"></i><i class="hill"></i>
    <svg class="pl" id="pl" viewBox="0 0 100 200"></svg><svg class="pl pr" id="pr" viewBox="0 0 100 200"></svg>
    <svg class="bf" style="left:20%;top:24%" viewBox="0 0 24 18"><path d="M12 9C6 -2 -2 3 3 11 5 14 10 13 12 9ZM12 9C18 -2 26 3 21 11 19 14 14 13 12 9Z"/></svg>
    <svg class="bf" style="right:18%;top:20%;animation-delay:-2s" viewBox="0 0 24 18"><path d="M12 9C6 -2 -2 3 3 11 5 14 10 13 12 9ZM12 9C18 -2 26 3 21 11 19 14 14 13 12 9Z"/></svg>
  </div>
  <div class="L bg-smile" data-f="s6"></div>
  <div class="L" data-f="s6">
    <svg class="pf" id="pf" viewBox="0 0 120 120"></svg>
    <svg class="dood" viewBox="0 0 90 90" fill="none" stroke="#e8c9a0" stroke-width="1.1" stroke-linecap="round">
      <path d="M45 40c-8-12-26-4-18 12 5 10 18 18 18 18s13-8 18-18c8-16-10-24-18-12z"/>
      <path d="M12 85C20 60 30 50 52 30"/><path d="M70 18l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    </svg>
    <svg class="girl" viewBox="0 0 200 340">
      <path d="M100 20C40 20 30 90 35 180C38 230 20 280 40 330L160 330C180 280 162 230 165 180C170 90 160 20 100 20Z" fill="#241326"/>
      <path d="M62 150L138 150L170 330L30 330Z" fill="#b24a67"/>
      <path d="M85 150L100 188L115 150Z" fill="#f4e8ee"/><path d="M96 170L104 170L100 200Z" fill="#3a1f2c"/>
      <ellipse cx="100" cy="92" rx="38" ry="42" fill="#f7e1d7"/>
      <path d="M60 88C66 44 134 44 140 88C122 68 78 68 60 88Z" fill="#241326"/>
      <path d="M78 94Q86 84 94 94M106 94Q114 84 122 94" stroke="#3a2230" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M86 108Q100 132 114 108Z" fill="#b8404f"/>
      <ellipse cx="74" cy="108" rx="7" ry="4" fill="#ffb3c4" opacity=".7"/><ellipse cx="126" cy="108" rx="7" ry="4" fill="#ffb3c4" opacity=".7"/>
      <ellipse cx="64" cy="128" rx="11" ry="9" fill="#f7e1d7"/>

    <div class="rec"><i class="disc"></i><p class="lyr" id="lyr"></p></div>

  <canvas id="fx"></canvas>
  <div id="eyes"><div class="eye"></div><div class="eye"></div></div>
  <p id="top" class="t"></p>
  <p id="cap" class="t"></p>
  <button id="replay" type="button">↻ Xem lại</button>
</div>

<script>
/* ===== EDIT HERE: the small lyric captions next to the spinning record.
   Replace the placeholders with your own words (use \n for a line break). ===== */
var LYRICS=["[lời bài hát 1]","[lời bài hát 2]","[lời bài hát 3]","[lời bài hát 4]","[lời bài hát 5]","[lời bài hát 6]"];

var $=function(i){return document.getElementById(i)},R=function(a,b){return a+Math.random()*(b-a)};

/* ---------- SVG builders ---------- */
function flower(x,y,r,f,s){var h='';for(var i=0;i<5;i++){var a=i*1.2566;h+='<circle cx="'+(x+Math.cos(a)*r*.9).toFixed(1)+'" cy="'+(y+Math.sin(a)*r*.9).toFixed(1)+'" r="'+(r*.7).toFixed(1)+'" fill="'+f+'" stroke="'+s+'" stroke-width=".6"/>'}return h+'<circle cx="'+x+'" cy="'+y+'" r="'+(r*.45).toFixed(1)+'" fill="#ffe08a"/>'}
function build(){
  var w=Math.round(120*innerWidth/(innerHeight*.36)),g='',f='',cols=['#ff8fb0','#8fc8ff','#ffc36b','#c9a0ff','#ff7a7a'];
  for(var i=0;i<w*1.1;i++){var x=R(0,w),h=R(25,70),b=R(-8,8);
    g+='<path d="M'+x.toFixed(1)+' 120Q'+(x+b/2).toFixed(1)+' '+(120-h/2).toFixed(1)+' '+(x+b).toFixed(1)+' '+(120-h).toFixed(1)+'" stroke="'+(Math.random()<.5?'#27d4bd':'#cbd83c')+'" stroke-width="'+R(.5,1.3).toFixed(1)+'" fill="none" opacity=".8"/>'}
  for(var X=14;X<w;X+=R(22,34)){var H=R(40,75),c=cols[Math.random()*5|0];
    f+='<g class="fl" style="transition-delay:'+R(1,3.2).toFixed(1)+'s"><path d="M'+X.toFixed(1)+' 120Q'+(X+4).toFixed(1)+' '+(120-H/2).toFixed(1)+' '+X.toFixed(1)+' '+(120-H).toFixed(1)+'" stroke="#3fd2a2" fill="none" stroke-width=".8"/>'+flower(+X.toFixed(1),+(120-H).toFixed(1),4.2,'rgba(255,255,255,.08)',c)+'</g>'}
  $('fieldsvg').setAttribute('viewBox','0 0 '+w+' 120');$('fieldsvg').innerHTML=g+f;
}
(function(){
  var p='<path d="M52 200C24 150 78 112 48 56" stroke="#e9c9e6" fill="none" stroke-width="1.2"/>';
  [[34,152],[64,124],[46,70],[70,92]].forEach(function(a){p+=flower(a[0],a[1],6,'rgba(255,220,240,.15)','#f3cbe6')});
  p+=flower(24,38,13,'none','#f3cbe6')+'<ellipse cx="62" cy="150" rx="8" ry="3" transform="rotate(-30 62 150)" fill="none" stroke="#7fd6c4"/><ellipse cx="38" cy="120" rx="8" ry="3" transform="rotate(30 38 120)" fill="none" stroke="#7fd6c4"/>';
  $('pl').innerHTML=p;$('pr').innerHTML=p;
  $('pf').innerHTML='<path d="M35 120V50M85 120V30" stroke="#d96aa0" stroke-width="2"/><ellipse cx="22" cy="95" rx="9" ry="3" transform="rotate(-30 22 95)" fill="#d96aa0"/><ellipse cx="98" cy="80" rx="9" ry="3" transform="rotate(30 98 80)" fill="#d96aa0"/>'+flower(35,48,9,'#f3a0c8','#ffd1e6')+flower(85,28,10,'#f3a0c8','#ffd1e6');
})();

/* ---------- particles (petals, golden leaves, stars, shooting stars) ---------- */
var cv=$('fx'),cx=cv.getContext('2d'),W,H,P=[],G=[],S=[],SH=[],lt=0,rt;
var fx={p:0,l:0,s:0,h:0},tg={p:0,l:0,s:0,h:0};
function size(){
  var D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  function mk(n,a,b){var o=[];for(var i=0;i<n;i++)o.push({x:R(0,W),y:R(0,H),s:R(a,b),v:R(.5,1.3),d:R(0,6.3),r:R(0,6.3)});return o}
  P=mk(Math.min(60,W*H/12000|0)+10,2,4);G=mk(14,4,7);
  S=[];for(var i=0,n=Math.min(150,W*H/8000|0);i<n;i++)S.push({x:R(0,W),y:R(0,H),r:R(.6,1.8),p:R(0,6.3),k:R(.5,2)});
  build();
}
function fall(a,t,col,al){
  cx.fillStyle=col;cx.globalAlpha=al;
  for(var i=0;i<a.length;i++){var p=a[i];p.y+=p.v;p.x+=Math.sin(t/900+p.d)*.6+.3;p.r+=.03;
    if(p.y>H+10){p.y=-10;p.x=R(0,W)}if(p.x>W+10)p.x=-10;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.beginPath();cx.moveTo(0,-p.s);cx.lineTo(p.s*.7,p.s);cx.lineTo(-p.s*.7,p.s);cx.fill();cx.restore()}
}
function tick(t){
  requestAnimationFrame(tick);if(t-lt<32)return;lt=t;
  for(var k in fx)fx[k]+=(tg[k]-fx[k])*.05;
  cx.clearRect(0,0,W,H);
  if(fx.s>.02){cx.fillStyle='#fff';for(var i=0;i<S.length;i++){var s=S[i];cx.globalAlpha=fx.s*(.35+.65*Math.abs(Math.sin(t/1000*s.k+s.p)));cx.fillRect(s.x,s.y,s.r,s.r)}}
  if(fx.p>.02)fall(P,t,'#ff7fb0',fx.p*.75);
  if(fx.l>.02)fall(G,t,'#f2b441',fx.l*.8);
  if(fx.h>.02&&Math.random()<.02*fx.h&&SH.length<3)SH.push({x:R(W*.3,W),y:R(0,H*.4),vx:R(-9,-6),vy:R(2,4),a:1});
  cx.lineWidth=1.5;cx.strokeStyle='#cfe8ff';
  for(var j=SH.length-1;j>=0;j--){var q=SH[j];q.x+=q.vx;q.y+=q.vy;q.a-=.018;if(q.a<=0){SH.splice(j,1);continue}
    cx.globalAlpha=q.a;cx.beginPath();cx.moveTo(q.x,q.y);cx.lineTo(q.x-q.vx*9,q.y-q.vy*9);cx.stroke()}
  cx.globalAlpha=1;
}
size();requestAnimationFrame(tick);
addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(size,200)});

/* ---------- timeline ---------- */
var eyes=$('eyes'),E=[].slice.call(eyes.children),topEl=$('top'),cap=$('cap'),lyr=$('lyr'),replay=$('replay'),tm=[];
function at(ms,f){tm.push(setTimeout(f,ms))}
function say(el,txt,cls){el.classList.remove('show');tm.push(setTimeout(function(){if(!txt)return;el.textContent=txt;el.className='t show '+(cls||'')},txt?500:0))}
function type(el,txt,cls,ms){el.className='t show '+cls;el.textContent='';var i=0;(function n(){if(i<=txt.length){el.textContent=txt.slice(0,i++);tm.push(setTimeout(n,ms))}})()}
function happy(a,b){E[0].classList.toggle('happy',a);E[1].classList.toggle('happy',b===undefined?a:b)}
function sc(n,x,y,o){
  [].forEach.call(document.querySelectorAll('.L'),function(l){l.classList.toggle('on',l.dataset.f.split(' ').indexOf(n)>-1)});
  eyes.style.setProperty('--x',x||'0px');eyes.style.setProperty('--y',y||'0px');
  for(var k in o)tg[k]=o[k];
}
setInterval(function(){
  if(eyes.classList.contains('on')&&!E[0].classList.contains('happy')&&!E[1].classList.contains('happy')){
    E.forEach(function(e){e.classList.add('blink')});setTimeout(function(){E.forEach(function(e){e.classList.remove('blink')})},170)}
},4200);

function play(){
  tm.forEach(clearTimeout);tm=[];replay.classList.remove('on');
  eyes.className='';E.forEach(function(e){e.className='eye'});
  topEl.className='t';cap.className='t';lyr.className='lyr';
  sc('s0','0px','0px',{p:0,l:0,s:0,h:0});

  at(300,function(){eyes.classList.add('on')});
  at(700,function(){type(topEl,'Hôm nay tớ nhận lệnh từ Dr D là để...','cy',60)});
  at(3900,function(){topEl.classList.remove('show')});

  at(4200,function(){sc('s1','0px','0px',{p:1,s:.3,l:0,h:0});eyes.classList.add('blush');E.forEach(function(e){e.classList.add('blink')});setTimeout(function(){E.forEach(function(e){e.classList.remove('blink')})},170);say(cap,'ui cậu đẹp quá','cy')});

  at(9800,function(){say(cap,'');say(topEl,'à thì cũng sắp\n20/10 rồi','pk');sc('s2','-10vmin','-2vmin',{p:.5,l:1,s:.3,h:.5})});

  at(17000,function(){eyes.classList.remove('blush');say(topEl,'nên là tớ muốn','cy');happy(true);sc('s3','-6vmin','0px',{p:0,l:0,s:1,h:1})});

  at(23000,function(){say(topEl,'chúc cậu thật nhiều sức khỏe','cy');happy(true,false);sc('s4','-14vmin','0px',{p:0,l:0,s:.6,h:.3})});
  at(24800,function(){happy(false)});

  at(26500,function(){say(topEl,'chúc cậu thật xinh đẹp','pw');sc('s5','0px','0px',{p:0,l:0,s:.9,h:0})});

  at(32000,function(){eyes.classList.add('blush');say(topEl,'và chúc cậu luôn giữ\nnụ cười trên môi','wm');sc('s6','-15vmin','-12vmin',{p:.3,l:0,s:.8,h:0})});
  LYRICS.forEach(function(l,i){
    at(33200+i*3200,function(){lyr.textContent=l;lyr.classList.add('show')});
    at(33200+i*3200+2700,function(){lyr.classList.remove('show')});
  });

  var end=33200+LYRICS.length*3200+600;
  at(end,function(){eyes.classList.remove('blush');happy(true);say(topEl,'20/10','cy big');sc('s7','0px','0px',{p:0,l:0,s:1,h:.6})});
  at(end+3500,function(){replay.classList.add('on')});
}

<!-- Tùy chọn 1: Tạo một nút bật/tắt nhạc để người dùng chủ động bấm -->
<div style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
  <button id="music-btn" onclick="toggleMusic()" style="padding: 10px 15px; border-radius: 20px; border: none; background: #00ffff; cursor: pointer; font-weight: bold;">
    🎵 Bật/Tắt Nhạc
  </button>
</div>

<script>
  var music = document.getElementById("bg-music");
  var btn = document.getElementById("music-btn");

  function toggleMusic() {
    if (music.paused) {
      music.play();
      btn.innerText = "🔇 Tắt Nhạc";
    } else {
      music.pause();
      btn.innerText = "🎵 Bật Nhạc";
    }
  }

  // Tùy chọn 2: Cố gắng tự động phát nhạc ngay khi người dùng click bất kỳ đâu lần đầu tiên trên trang
  document.body.addEventListener('click', function() {
    if (music.paused) {
      music.play().catch(function(error) {
        console.log("Trình duyệt chặn autoplay: ", error);
      });
    }
  }, { once: true });
</script>
